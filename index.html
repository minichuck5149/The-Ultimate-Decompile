<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Square Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }

        #gameContainer {
            position: relative;
            width: 600px;
            height: 400px;
            background: linear-gradient(180deg, #87ceeb 0%, #bfe9ff 55%, #9ed7ff 60%, #2d8f2d 60%, #2d8f2d 100%);
            border: 2px solid #4a9eff;
            overflow: hidden;
        }

        .sun {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #fff9c4 0%, #ffd966 60%, #ffbf00 100%);
            border-radius: 50%;
            right: 60px;
            top: 30px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.7);
            z-index: 1;
        }

        .cloud {
            position: absolute;
            height: 30px;
            background: rgba(255, 255, 255, 0.88);
            border-radius: 30px;
            z-index: 1;
            box-shadow: 20px 10px 0 rgba(255, 255, 255, 0.7), 40px 0 0 rgba(255, 255, 255, 0.7);
        }

        .cloud1 {
            width: 110px;
            left: 60px;
            top: 55px;
        }

        .cloud2 {
            width: 90px;
            left: 220px;
            top: 90px;
            transform: scale(0.9);
        }

        .cloud3 {
            width: 120px;
            right: 150px;
            top: 75px;
            transform: scale(0.8);
        }

        .hill {
            position: absolute;
            bottom: 42px;
            border-radius: 50% 50% 0 0;
            background: #4aa84a;
            border: 2px solid rgba(0, 0, 0, 0.06);
            z-index: 1;
        }

        .hill1 {
            width: 200px;
            height: 90px;
            left: -20px;
        }

        .hill2 {
            width: 240px;
            height: 100px;
            left: 180px;
        }

        .hill3 {
            width: 220px;
            height: 95px;
            right: -20px;
        }

        .grass-line {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 38px;
            height: 4px;
            background: rgba(99, 179, 99, 0.7);
            z-index: 2;
        }

        .tree {
            position: absolute;
            bottom: 45px;
            width: 22px;
            height: 52px;
            z-index: 3;
        }

        .tree .trunk {
            position: absolute;
            left: 8px;
            bottom: 0;
            width: 6px;
            height: 22px;
            background: #6b3d1d;
            border-radius: 4px;
        }

        .tree .leaf {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            background: #1f7a34;
            border-radius: 50%;
        }

        .tree .leaf1 { bottom: 16px; }
        .tree .leaf2 { bottom: 28px; left: 15%; }
        .tree .leaf3 { bottom: 28px; left: 85%; }

        .tree1 { left: 120px; }
        .tree2 { left: 430px; transform: scale(1.2); }

        .flowers {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 40px;
            height: 30px;
            z-index: 4;
        }

        .flower {
            position: absolute;
            bottom: 0;
            width: 10px;
            height: 10px;
            background: #ff4d94;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.25);
        }

        .flower::before,
        .flower::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff4d94;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .flower::before { transform: translate(-50%, -50%) rotate(45deg); }
        .flower::after { transform: translate(-50%, -50%) rotate(-45deg); }

        .flower1 { left: 90px; }
        .flower2 { left: 160px; background: #ffd166; }
        .flower3 { left: 260px; background: #7ce7ff; }
        .flower4 { left: 350px; background: #ff8fab; }
        .flower5 { left: 485px; background: #9ae66e; }

        #square {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #4a9eff;
            left: 280px;
            top: 180px;
            transition: all 0.05s;
            z-index: 10;
        }

        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #ffffff;
            font-size: 14px;
            z-index: 20;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>

        <div class="hill hill1"></div>
        <div class="hill hill2"></div>
        <div class="hill hill3"></div>

        <div class="grass-line"></div>

        <div class="tree tree1">
            <div class="leaf leaf1"></div>
            <div class="leaf leaf2"></div>
            <div class="leaf leaf3"></div>
            <div class="trunk"></div>
        </div>

        <div class="tree tree2">
            <div class="leaf leaf1"></div>
            <div class="leaf leaf2"></div>
            <div class="leaf leaf3"></div>
            <div class="trunk"></div>
        </div>

        <div class="flowers">
            <div class="flower flower1"></div>
            <div class="flower flower2"></div>
            <div class="flower flower3"></div>
            <div class="flower flower4"></div>
            <div class="flower flower5"></div>
        </div>

        <div id="square"></div>
        <div id="info">Use Arrow Keys to move</div>
    </div>

    <script>
        const square = document.getElementById('square');
        const gameContainer = document.getElementById('gameContainer');

        let x = 280;
        let y = 180;
        const speed = 10;
        const squareSize = 40;
        const containerWidth = gameContainer.offsetWidth;
        const containerHeight = gameContainer.offsetHeight;

        const keys = {};

        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function update() {
            if (keys['ArrowUp'] && y > 0) {
                y -= speed;
            }
            if (keys['ArrowDown'] && y < containerHeight - squareSize) {
                y += speed;
            }
            if (keys['ArrowLeft'] && x > 0) {
                x -= speed;
            }
            if (keys['ArrowRight'] && x < containerWidth - squareSize) {
                x += speed;
            }

            square.style.left = x + 'px';
            square.style.top = y + 'px';

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
